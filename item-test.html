<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Test TikTok Affiliate Redirect | Apocalypse Closet</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0c0c0f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 430px);
      background: #17171c;
      border: 1px solid #2b2b33;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    .hero {
      aspect-ratio: 1 / 1;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 0, 80, .22), transparent 38%),
        radial-gradient(circle at 75% 70%, rgba(0, 242, 234, .15), transparent 35%),
        #101014;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 34px;
    }
    .hero strong {
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -.7px;
    }
    .content {
      padding: 22px;
    }
    .eyebrow {
      color: #aaaab5;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 20px;
      line-height: 1.35;
      margin: 0 0 10px;
    }
    p {
      margin: 0 0 18px;
      color: #bdbdc7;
      font-size: 14px;
      line-height: 1.55;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px 18px;
      border-radius: 14px;
      background: #fe2c55;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      border: 0;
      cursor: pointer;
    }
    .btn:active { transform: scale(.99); }
    .small {
      margin-top: 14px;
      color: #74747f;
      font-size: 11px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="hero">
      <strong>APOCALYPSE<br>CLOSET</strong>
    </section>
    <section class="content">
      <div class="eyebrow">Redirect test</div>
      <h1>Test mở sản phẩm trên TikTok Shop</h1>
      <p>Bấm nút bên dưới để kiểm tra luồng Website → TikTok Shop / TikTok app.</p>

      <!-- Cố ý dùng link <a> trực tiếp, không target=_blank, không window.open -->
      <a class="btn" href="https://vt.tiktok.com/ZS9BWH9Pqc5q1-pAaoX/">MUA TRÊN TIKTOK</a>

      <div class="small">Affiliate URL: https://vt.tiktok.com/ZS9BWH9Pqc5q1-pAaoX/</div>
    </section>
  </main>
</body>
</html>
