      text-decoration: none; color: inherit;

      filter: grayscale(0.7) contrast(1.05);

      border-top-color: var(--red); border-radius: 50%;

        description: 'Y2K đang quay lại — nhưng phiên bản tối hơn, sắc bén hơn và ít Instagram-friendly hơn. Dark Y2K aesthetic là gì và cách build wardrobe không bị trùng với mọi người.'
      },
      {
        slug: 'cach-phoi-do-den-khong-nham-chan',
        shortTitle: 'Cách Phối Đồ Đen Không Nhàm Chán',
        category: 'Style Guide',
        date: '25 May 2026',
        tags: ['#AllBlack','#StyleGuide','#OOTD'],
        cover: '/images/blog-covers/cach-phoi-do-den-khong-nham-chan.webp',
        coverAlt: 'All-black outfit với texture layering và statement accessories',
        description: 'All-black không phải lazy dressing — đó là kỷ luật thẩm mỹ cao nhất. 7 công thức phối đồ đen không nhàm chán từ góc nhìn của dark fashion.'
      },
      {
        slug: 'alt-fashion-la-gi-va-tai-sao-no-quan-trong',
        shortTitle: 'Alt Fashion Là Gì',
        category: 'Tâm Lý Học',
        date: '26 May 2026',
        tags: ['#AltFashion','#Identity','#Subculture'],
        cover: '/images/blog-covers/alt-fashion-la-gi-va-tai-sao-no-quan-trong.webp',
        coverAlt: 'Alt fashion outfit với mixed aesthetics và statement accessories',
        description: 'Alt fashion không phải rebellion trẻ con. Đó là cách một số người từ chối để hệ thống quyết định họ trông như thế nào — và tại sao điều đó có ý nghĩa chính trị thật sự.'
      }
    ];

    const BATCH = 12;
    const STEP  = 6;
    const FILTERS = [
      { id: 'style', label: 'Phong cách', categories: ['Aesthetic','Style Guide','Style Audit','Trend Anatomy','Material Ledger'] },
      { id: 'mix', label: 'Phối đồ', categories: ['Fit Lab','Dress Code Desk','Fashion Basics','Office Code'] },
      { id: 'shopping', label: 'Mua sắm', categories: ['Shopping Guide','Garment Lab'] },
      { id: 'care', label: 'Chăm sóc', categories: ['Care Guide','Beauty Guide'] },
      { id: 'mindset', label: 'Tâm lý', categories: ['Tâm Lý Học'] },
      { id: 'tips', label: 'Tips', categories: ['Tips'] }
    ];
    let activeFilter = 'all';
    let searchQuery = '';
    let visibleLimit = BATCH;

    const urlFilter = new URLSearchParams(window.location.search).get('category');
    if (urlFilter && FILTERS.some(f => f.id === urlFilter)) activeFilter = urlFilter;

    renderCards();
    buildFilterBar();
    applyVisibility();

    document.getElementById('load-more-btn').addEventListener('click', () => {
      visibleLimit += STEP;
      applyVisibility();
    });
    document.getElementById('post-search').addEventListener('input', event => {
      searchQuery = event.target.value.trim().toLocaleLowerCase('vi');
      visibleLimit = BATCH;
      applyVisibility();
    });

    function renderCards() {
      const grid = document.getElementById('post-grid');
      grid.innerHTML = '';
      POSTS.forEach(post => {
        const loading = POSTS.indexOf(post) < 6 ? 'eager' : 'lazy';
        const a = document.createElement('a');
        a.className = 'post-card';
        a.href = `blog/${post.slug}.html`;
        a.dataset.tags = post.tags.join(' ');
        a.dataset.category = post.category;
        a.dataset.search = `${post.shortTitle} ${post.description} ${post.category} ${post.tags.join(' ')}`.toLocaleLowerCase('vi');
        a.innerHTML = `
          <div class="card-cover">
            <img src="${post.cover}" alt="${post.coverAlt}" loading="${loading}">
          </div>
          <div class="card-body">
            <div class="card-meta">
              <span>${post.category}</span>
              <span class="dot"></span>
              <span>${post.date}</span>
            </div>
            <h2 class="card-title">${post.shortTitle}</h2>
            <p class="card-desc">${post.description}</p>
            <span class="card-link">Đọc thêm →</span>
          </div>`;
        grid.appendChild(a);
      });
    }

    function buildFilterBar() {
      const bar = document.getElementById('filter-bar');
      if (!bar) return;
      FILTERS.forEach(filter => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.type = 'button';
        btn.dataset.filter = filter.id;
        btn.textContent = filter.label;
        bar.appendChild(btn);
      });
      bar.addEventListener('click', event => {
        const btn = event.target.closest('.filter-btn');
        if (!btn) return;
        activeFilter = btn.dataset.filter || 'all';
        visibleLimit = BATCH;
        applyVisibility();
      });
    }

    function applyVisibility() {
      const cards = [...document.querySelectorAll('#post-grid .post-card')];

      function cardMatches(card) {
        const filter = FILTERS.find(item => item.id === activeFilter);
        const categoryMatch = !filter || filter.categories.includes(card.dataset.category);
        const searchMatch = !searchQuery || (card.dataset.search || '').includes(searchQuery);
        return categoryMatch && searchMatch;
      }

      const matched = cards.filter(cardMatches);
      const shown = Math.min(visibleLimit, matched.length);

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === activeFilter);
      });

      cards.forEach(card => { card.hidden = true; });
      matched.slice(0, shown).forEach(card => { card.hidden = false; });

      const wrap = document.getElementById('load-more-wrap');
      if (wrap) wrap.hidden = shown >= matched.length;

      let es = document.getElementById('post-empty-state');
      if (!es) {
        es = document.createElement('div');
        es.id = 'post-empty-state';
        es.className = 'state-screen';
        es.innerHTML = '<p>Không tìm thấy bài viết phù hợp.</p>';
        document.getElementById('post-grid').appendChild(es);
      }
      es.style.display = matched.length === 0 ? 'flex' : 'none';
      const count = document.getElementById('results-count');
      if (count) count.textContent = matched.length ? `Đang hiển thị ${shown}/${matched.length} bài viết` : 'Không có kết quả';
    }
  </script>
<script src="/assets/js/analytics-enhancements.min.js" defer></script>
